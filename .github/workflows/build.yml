name: Build Android App
on:
push:
branches:
- main
- master
pull_request:
branches:
- main
- master
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
# 1. Automatic discovery of Gradle directory (handles subfolders & root)
- name: Find Gradle Root Directory
id: gradle-dir
run: |
BUILD_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
if [ -n "￼
DIR=(dirname "$BUILD_FILE")
echo "path=$DIR" >> $GITHUB_OUTPUT
echo "Found Gradle root directory at: $DIR"
else
echo "path=." >> $GITHUB_OUTPUT
echo "Gradle settings file not found in subdirectories, defaulting to root."
fi
# 2. Setup Java without built-in cache dependency checks (avoids action failure)
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
# 3. Smart, fail-safe Gradle Caching setup
- name: Cache Gradle packages
uses: actions/cache@v4
with:
path: |
~/.gradle/caches
~/.gradle/wrapper
key: ￼{{ hashFiles('/.gradle', '/gradle-wrapper.properties', '/libs.versions.toml') }}
restore-keys: |
${{ runner.os }}-gradle-
- name: Setup Android SDK
uses: android-actions/setup-android@v3
- name: Make gradlew executable
working-directory: ${{ steps.gradle-dir.outputs.path }}
run: chmod +x gradlew
- name: Build with Gradle
working-directory: ${{ steps.gradle-dir.outputs.path }}
run: ./gradlew assembleDebug --stacktrace
- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: app-debug
path: '/build/outputs/apk/debug/*.apk'
