name: Build Drive Music (single APK)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: drive-music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile unified app for Android 9+
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Restore upstream source submodules
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf media musikr/src/main/cpp/taglib
          git clone --depth 1 --recurse-submodules https://github.com/OxygenCobalt/media.git media
          git clone https://github.com/taglib/taglib.git musikr/src/main/cpp/taglib
          git -C musikr/src/main/cpp/taglib checkout ee1931b

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build the unified debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFossDebug

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: Drive-Music-single-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
