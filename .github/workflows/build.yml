name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract all source ZIP archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/android-source"

          # Extract ZIP files recursively, including ZIPs inside ZIPs.
          for round in 1 2 3; do
            while IFS= read -r -d '' archive; do
              hash="$(sha256sum "$archive" | cut -c1-16)"
              destination="$RUNNER_TEMP/android-source/archive-$hash"

              if [[ ! -f "$destination/.extracted" ]]; then
                mkdir -p "$destination"
                echo "Extracting $archive"
                unzip -oq "$archive" -d "$destination"
                touch "$destination/.extracted"
              fi
            done < <(
              find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-source" \
                -type d \( -name .git -o -name build -o -name .gradle \) -prune -o \
                -type f -iname '*.zip' -print0 2>/dev/null
            )
          done

      - name: Find complete Gradle projects
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECTS="$RUNNER_TEMP/gradle-projects.txt"
          : > "$PROJECTS"

          for root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-source"; do
            [[ -d "$root" ]] || continue

            while IFS= read -r -d '' settings; do
              project="$(dirname "$settings")"

              # Skip projects with missing included Gradle builds.
              missing=0
              while IFS= read -r include_path; do
                [[ -n "$include_path" ]] || continue
                if [[ ! -d "$project/$include_path" ]]; then
                  echo "Incomplete project: $project"
                  echo "Missing included build: $project/$include_path"
                  missing=1
                fi
              done < <(
                sed -nE \
                  "s/.*includeBuild\\(['\"]([^'\"]+)['\"]\\).*/\\1/p" \
                  "$settings"
              )

              if [[ "$missing" -eq 0 ]]; then
                printf '%s\n' "$project" >> "$PROJECTS"
              fi
            done < <(
              find "$root" \
                -type d \( -name .git -o -name build -o -name .gradle \) -prune -o \
                -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print0
            )
          done

          sort -u "$PROJECTS" -o "$PROJECTS"

          if [[ ! -s "$PROJECTS" ]]; then
            echo "::error::No complete Gradle project found."
            echo "The source archive appears incomplete or is missing required build-logic files."
            echo "Files named build-logic-settings:"
            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-source" \
              -type d -name build-logic-settings -print || true
            echo "Gradle settings files:"
            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-source" \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print || true
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
              -not -path '*/.git/*' | head -250
            exit 1
          fi

          echo "Complete projects found:"
          cat "$PROJECTS"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK" ]]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Installed SDK platforms:"
          ls -la "$SDK/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        shell: bash
        run: |
          set -uo pipefail

          PROJECTS="$RUNNER_TEMP/gradle-projects.txt"
          OUTPUT="$RUNNER_TEMP/apk-output"

          mkdir -p "$OUTPUT"
          success=0
          failure=0

          while IFS= read -r project; do
            [[ -n "$project" ]] || continue

            echo ""
            echo "========================================"
            echo "Building: $project"
            echo "========================================"

            if [[ -f "$project/gradlew" ]] && \
               [[ -f "$project/gradle/wrapper/gradle-wrapper.jar" ]]; then
              chmod +x "$project/gradlew"
              GRADLE="$project/gradlew"
            else
              GRADLE="gradle"
            fi

            if ! (cd "$project" && "$GRADLE" --no-daemon --stacktrace assembleDebug); then
              echo "::error::Build failed: $project"
              failure=1
              continue
            fi

            count=0
            while IFS= read -r -d '' apk; do
              name="$(basename "$project")"
              mkdir -p "$OUTPUT/$name"
              cp "$apk" "$OUTPUT/$name/"
              echo "APK created: $apk"
              count=$((count + 1))
              success=$((success + 1))
            done < <(
              find "$project" -type f \
                -path '*/build/outputs/apk/*.apk' -print0
            )

            if [[ "$count" -eq 0 ]]; then
              echo "::warning::Build succeeded but no APK was found in $project"
            fi
          done < "$PROJECTS"

          echo ""
          echo "Generated APKs:"
          find "$OUTPUT" -type f -name '*.apk' -print || true

          if [[ "$success" -eq 0 ]]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          if [[ "$failure" -ne 0 ]]; then
            echo "::warning::At least one project failed to build."
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ runner.temp }}/apk-output/**/*.apk
          if-no-files-found: warn
          retention-days: 14
