name: Build Muzyka

on:
workflow_dispatch:
push:
branches: [main, master]

permissions:
contents: read

concurrency:
group: muzyka-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
name: Build Android APK
runs-on: ubuntu-22.04
timeout-minutes: 90

steps:
  - name: Checkout project
    uses: actions/checkout@v4
  - name: Restore upstream sources
    shell: bash
    run: |
      set -euxo pipefail
      rm -rf media musikr/src/main/cpp/taglib
      git clone --depth 1 --recurse-submodules https://github.com/OxygenCobalt/media.git media
      git clone https://github.com/taglib/taglib.git musikr/src/main/cpp/taglib
      git -C musikr/src/main/cpp/taglib checkout ee1931b
  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle
  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      cmdline-tools-version: '12266719'
      accept-android-sdk-licenses: true
  - name: Install Android packages
    shell: bash
    run: |
      set -euxo pipefail
      sdkmanager --version
      yes | sdkmanager --licenses || true
      sdkmanager --install \
        "platforms;android-36" \
        "build-tools;36.0.0" \
        "ndk;28.2.13676358" \
        "cmake;3.22.1"
      sudo apt-get update
      sudo apt-get install -y ninja-build
  - name: Build APK
    shell: bash
    run: |
      set -euxo pipefail
      chmod +x gradlew
      ./gradlew --no-daemon --stacktrace :app:assembleFossDebug
  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Muzyka-APK
      path: app/build/outputs/apk/foss/debug/*.apk
      if-no-files-found: error
      retention-days: 14
