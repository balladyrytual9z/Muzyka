name: Build Muzyka APK

‘on’:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

concurrency:
group: muzyka-build-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
name: Build Android APK
runs-on: ubuntu-22.04
timeout-minutes: 90

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
  - name: Check project structure
    shell: bash
    run: |
      set -euo pipefail
      echo "Repository: $GITHUB_WORKSPACE"
      ls -la
      if [ ! -f "./gradlew" ]; then
        echo "::error::Nie znaleziono gradlew w katalogu głównym repozytorium."
        echo "Sprawdź, czy ZIP został rozpakowany i cała zawartość projektu została przesłana na GitHub."
        find . -maxdepth 3 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print
        exit 1
      fi
      if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
        echo "::error::Brakuje settings.gradle lub settings.gradle.kts w katalogu głównym."
        find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -print
        exit 1
      fi
      chmod +x ./gradlew
  - name: Install Android SDK packages
    shell: bash
    env:
      ANDROID_HOME: ${{ env.ANDROID_HOME }}
    run: |
      set -euo pipefail
      if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
        echo "::error::ANDROID_HOME nie wskazuje katalogu Android SDK."
        exit 1
      fi
      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
        -type f -name sdkmanager -print -quit 2>/dev/null || true)"
      if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
        echo "::error::Nie znaleziono sdkmanager w $ANDROID_HOME/cmdline-tools."
        find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
        exit 1
      fi
      echo "Using sdkmanager: $SDKMANAGER"
      "$SDKMANAGER" --version
      yes | "$SDKMANAGER" --licenses || true
      "$SDKMANAGER" --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "cmake;3.22.1" \
        "ndk;28.2.13676358"
  - name: Install Ninja
    shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y ninja-build
  - name: Build Muzyka debug APK
    shell: bash
    run: |
      set -euo pipefail
      ./gradlew --no-daemon --stacktrace :app:assembleFossDebug
  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Muzyka-APK
      path: app/build/outputs/apk/foss/debug/*.apk
      if-no-files-found: error
      retention-days: 14
