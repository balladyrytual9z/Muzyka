name: Build Drive Music (single APK)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: drive-music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile unified app for Android 9+
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # 1. Konfiguracja Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 2. Używamy wbudowanego w runner Android SDK zamiast wadliwej akcji setup-android
      - name: Install required Android packages and NDK
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Akceptacja licencji
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # Instalacja wymaganych komponentów
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" || true
          sdkmanager "ndk;28.2.13676358" || sdkmanager "ndk;26.1.10909125" || true

      - name: Find and extract ZIP
        id: extract
        run: |
          echo "=== Szukam pliku ZIP ==="
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "BŁĄD: Nie znaleziono pliku .zip!"
            ls -la
            exit 1
          fi
          echo "Znaleziono ZIP: $ZIP_FILE"
          
          unzip -q "$ZIP_FILE" -d extracted
          
          GRADLEW_PATH=$(find extracted -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "BŁĄD: Nie znaleziono gradlew wewnątrz archiwum!"
            find extracted -maxdepth 3
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Projekt w: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Fix downloader for AGP 9 (safe patch)
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          if [ -f "downloader/build.gradle" ]; then
            sed -i "/id 'org.jetbrains.kotlin.android'/d" downloader/build.gradle || true
            sed -i "/kotlinOptions { jvmTarget = '17' }/d" downloader/build.gradle || true
            sed -i "/androidResources { generateLocaleConfig true }/d" downloader/build.gradle || true
            echo "=== Po poprawkach w downloader/build.gradle ==="
            head -45 downloader/build.gradle
          fi

      - name: Restore upstream source submodules
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf media musikr/src/main/cpp/taglib
          
          git clone --depth 1 --recurse-submodules https://github.com/OxygenCobalt/media.git media
          
          mkdir -p musikr/src/main/cpp
          git clone https://github.com/taglib/taglib.git musikr/src/main/cpp/taglib
          git -C musikr/src/main/cpp/taglib checkout ee1931b
          git -C musikr/src/main/cpp/taglib submodule update --init --recursive

      - name: Build the unified debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFossDebug || ./gradlew --no-daemon --stacktrace assembleDebug

      - name: List built APKs
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          echo "=== Wygenerowane pliki APK ==="
          find . -name "*.apk" -type f

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: Drive-Music-single-APK
          path: |
            ${{ steps.extract.outputs.project_dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
