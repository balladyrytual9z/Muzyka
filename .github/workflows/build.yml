name: Build Drive Music (single APK)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: drive-music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile unified app for Android 9+
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        id: extract
        run: |
          echo "=== Szukam pliku ZIP ==="
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "BŁĄD: Nie znaleziono pliku .zip!"
            ls -la
            exit 1
          fi
          echo "Znaleziono ZIP: $ZIP_FILE"
          
          unzip -q "$ZIP_FILE" -d extracted
          
          GRADLEW_PATH=$(find extracted -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "BŁĄD: Nie znaleziono gradlew!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Projekt w: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Fix downloader for AGP 9
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          sed -i "/id 'org.jetbrains.kotlin.android'/d" downloader/build.gradle
          sed -i "/kotlinOptions { jvmTarget = '17' }/d" downloader/build.gradle
          echo "=== Po poprawkach ==="
          head -40 downloader/build.gradle

      - name: Restore upstream source submodules
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf media musikr/src/main/cpp/taglib
          git clone --depth 1 --recurse-submodules https://github.com/OxygenCobalt/media.git media
          git clone https://github.com/taglib/taglib.git musikr/src/main/cpp/taglib
          git -C musikr/src/main/cpp/taglib checkout ee1931b

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build the unified debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFossDebug

      - name: List built APKs
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: find app/build/outputs -name "*.apk" -type f || true

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: Drive-Music-single-APK
          path: |
            ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
            ${{ steps.extract.outputs.project_dir }}/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
