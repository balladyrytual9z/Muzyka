name: Build Muzyka

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-22.04
timeout-minutes: 90

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle
  - name: Install Android SDK
    shell: bash
    run: |
      set -euxo pipefail
      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
      mkdir -p "$ANDROID_HOME/cmdline-tools"
      curl -fL --retry 3 \
        https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
        -o /tmp/android-tools.zip
      mkdir -p /tmp/android-tools
      unzip -q /tmp/android-tools.zip -d /tmp/android-tools
      rm -rf "$ANDROID_HOME/cmdline-tools/latest"
      mv /tmp/android-tools/cmdline-tools \
        "$ANDROID_HOME/cmdline-tools/latest"
      echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
      yes | sdkmanager --licenses || true
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-36" \
        "build-tools;36.0.0" \
        "ndk;28.2.13676358" \
        "cmake;3.22.1"
  - name: Install Ninja
    run: |
      sudo apt-get update
      sudo apt-get install -y ninja-build
  - name: Show SDK configuration
    run: |
      set -euxo pipefail
      sdkmanager --list_installed
      java -version
  - name: Build debug APK
    shell: bash
    run: |
      set -euxo pipefail
      chmod +x ./gradlew
      ./gradlew --no-daemon --stacktrace :app:assembleFossDebug
  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Muzyka-APK
      path: app/build/outputs/apk/foss/debug/*.apk
      if-no-files-found: error
      retention-days: 14
