name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-source"

          while IFS= read -r -d '' archive; do
            name="$(basename "$archive" .zip)"
            destination="$RUNNER_TEMP/android-source/$name"
            mkdir -p "$destination"
            echo "Extracting: $archive"
            unzip -oq "$archive" -d "$destination"
          done < <(
            find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './.git/*' -print0
          )

      - name: Locate Gradle projects
        shell: bash
        run: |
          set -euo pipefail

          PROJECTS="$RUNNER_TEMP/gradle-projects.txt"
          : > "$PROJECTS"

          for root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-source"; do
            [[ -d "$root" ]] || continue

            find "$root" \
              -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0 |
            while IFS= read -r -d '' file; do
              dirname "$file" >> "$PROJECTS"
            done
          done

          sort -u "$PROJECTS" -o "$PROJECTS"

          if [[ ! -s "$PROJECTS" ]]; then
            echo "::error::No Gradle project found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
              -not -path '*/.git/*' | head -250
            echo "Extracted ZIP files:"
            find "$RUNNER_TEMP/android-source" -maxdepth 6 -type f \
              | head -250 || true
            exit 1
          fi

          echo "Found Gradle projects:"
          cat "$PROJECTS"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK" ]]; then
            echo "::error::Android SDK not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Installed Android platforms:"
          ls -la "$SDK/platforms" || true

          echo "Installed Android build tools:"
          ls -la "$SDK/build-tools" || true

          if [[ ! -d "$SDK/platforms/android-35" ]] && \
             [[ ! -d "$SDK/platforms/android-34" ]] && \
             [[ ! -d "$SDK/platforms/android-33" ]]; then
            echo "::error::No Android platform 33, 34 or 35 is preinstalled."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        shell: bash
        run: |
          set -uo pipefail

          PROJECTS="$RUNNER_TEMP/gradle-projects.txt"
          OUTPUT="$RUNNER_TEMP/apk-output"

          mkdir -p "$OUTPUT"
          successful=0
          failed=0
          index=0

          while IFS= read -r project; do
            [[ -n "$project" ]] || continue

            index=$((index + 1))
            echo ""
            echo "========== Project $index: $project =========="

            if [[ -f "$project/gradlew" ]] && \
               [[ -f "$project/gradle/wrapper/gradle-wrapper.jar" ]]; then
              chmod +x "$project/gradlew"
              GRADLE="$project/gradlew"
            else
              GRADLE="gradle"
              echo "Using installed Gradle."
            fi

            if ! (cd "$project" && "$GRADLE" --no-daemon tasks --all >/dev/null); then
              echo "::error::Gradle could not configure project: $project"
              failed=1
              continue
            fi

            if (cd "$project" && "$GRADLE" --no-daemon --stacktrace assembleDebug); then
              while IFS= read -r -d '' apk; do
                safe="$(basename "$project")"
                mkdir -p "$OUTPUT/$safe"
                cp "$apk" "$OUTPUT/$safe/"
                echo "APK generated: $apk"
                successful=$((successful + 1))
              done < <(
                find "$project" -type f \
                  -path '*/build/outputs/apk/*.apk' -print0
              )
            else
              echo "::error::Build failed: $project"
              failed=1
            fi
          done < "$PROJECTS"

          echo ""
          echo "Generated APK files:"
          find "$OUTPUT" -type f -name '*.apk' -print || true

          if [[ "$successful" -eq 0 ]]; then
            echo "::error::No APK was generated. Review the build log above."
            exit 1
          fi

          if [[ "$failed" -ne 0 ]]; then
            echo "::warning::Some projects failed, but generated APKs will be uploaded."
          fi

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Muzyka-Android-APK
          path: ${{ runner.temp }}/apk-output/**/*.apk
          if-no-files-found: warn
          retention-days: 14
